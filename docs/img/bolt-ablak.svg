<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="Segoe UI, Arial, sans-serif">
  <title>A bolt-ablak felépítése</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="900" height="560" fill="#f6f8fa"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#0f172a">A bolt-ablak (mock-up)</text>

  <!-- the window -->
  <rect x="20" y="44" width="620" height="412" rx="6" fill="#0a0a0a" stroke="#737373" stroke-width="2"/>
  <!-- header -->
  <rect x="32" y="56" width="28" height="28" rx="2" fill="#525252"/>
  <text x="68" y="76" font-size="13" fill="#fde68a" font-weight="bold">SMITH'S FORGE</text>
  <text x="430" y="76" font-size="12" fill="#a3a3a3">Kredit: <tspan fill="#fde68a">120 cr</tspan> <tspan fill="#6ee7b7">-&gt; 94 cr</tspan></text>
  <text x="614" y="76" font-size="16" fill="#a3a3a3">×</text>

  <!-- intro (the simple shop only) -->
  <rect x="32" y="96" width="76" height="76" rx="3" fill="#171717" stroke="#404040"/>
  <circle cx="70" cy="122" r="13" fill="#404040"/><path d="M44,172 c0,-20 11,-30 26,-30 s26,10 26,30 z" fill="#404040"/>
  <text x="120" y="108" font-size="9" fill="#a3a3a3">SMITH</text>
  <rect x="120" y="114" width="508" height="58" rx="3" fill="#171717" stroke="#404040"/>
  <text x="130" y="136" font-size="12" fill="#f5f5f5">Ha vasra van szükséged, jó helyen jársz.</text>
  <text x="130" y="154" font-size="12" fill="#f5f5f5">Nézz körül, és ne alkudj túl sokat.</text>

  <!-- stock -->
  <text x="32" y="194" font-size="11" fill="#a3a3a3">Készlet</text>
  <g stroke="#737373" fill="#262626">
    <rect x="32" y="200" width="40" height="40"/><rect x="76" y="200" width="40" height="40"/><rect x="120" y="200" width="40" height="40"/><rect x="164" y="200" width="40" height="40"/><rect x="208" y="200" width="40" height="40"/><rect x="252" y="200" width="40" height="40"/>
    <rect x="32" y="244" width="40" height="40"/><rect x="76" y="244" width="40" height="40"/><rect x="120" y="244" width="40" height="40"/><rect x="164" y="244" width="40" height="40"/><rect x="208" y="244" width="40" height="40"/><rect x="252" y="244" width="40" height="40"/>
  </g>
  <g font-size="10" fill="#fde68a"><text x="35" y="213">10</text><text x="79" y="213">26</text><text x="123" y="213">54</text></g>
  <g font-size="10" fill="#e5e5e5"><text x="60" y="236">∞</text><text x="104" y="236">4</text><text x="148" y="236">2</text></g>
  <g font-size="10" fill="#d4d4d4" text-anchor="middle"><text x="52" y="228">nyíl</text><text x="96" y="228">tőr</text><text x="140" y="228">kard</text></g>

  <!-- backpack -->
  <text x="330" y="194" font-size="11" fill="#a3a3a3">Hátizsák</text>
  <g stroke="#737373" fill="#262626">
    <rect x="330" y="200" width="40" height="40"/><rect x="374" y="200" width="40" height="40"/><rect x="418" y="200" width="40" height="40"/><rect x="462" y="200" width="40" height="40"/><rect x="506" y="200" width="40" height="40"/><rect x="550" y="200" width="40" height="40"/>
    <rect x="330" y="244" width="40" height="40"/><rect x="374" y="244" width="40" height="40"/><rect x="418" y="244" width="40" height="40"/><rect x="462" y="244" width="40" height="40"/><rect x="506" y="244" width="40" height="40"/><rect x="550" y="244" width="40" height="40"/>
    <rect x="330" y="288" width="40" height="40"/><rect x="374" y="288" width="40" height="40"/><rect x="418" y="288" width="40" height="40"/><rect x="462" y="288" width="40" height="40"/><rect x="506" y="288" width="40" height="40"/><rect x="550" y="288" width="40" height="40"/>
    <rect x="330" y="332" width="40" height="40"/><rect x="374" y="332" width="40" height="40"/><rect x="418" y="332" width="40" height="40"/><rect x="462" y="332" width="40" height="40"/><rect x="506" y="332" width="40" height="40"/><rect x="550" y="332" width="40" height="40"/>
  </g>
  <text x="334" y="224" font-size="10" fill="#e5e5e5">gyógy</text>
  <text x="378" y="224" font-size="10" fill="#e5e5e5">érme</text>

  <!-- info + hint -->
  <rect x="32" y="384" width="596" height="34" rx="3" fill="#171717" stroke="#404040"/>
  <text x="42" y="405" font-size="12" fill="#d4d4d4">Kard: rövid leírás · Vétel: 54 cr</text>
  <text x="32" y="440" font-size="11" fill="#fde68a">Kard: 54 cr (húzd a hátizsákba vagy egy kézbe)</text>

  <!-- party dock: outside the window, stays usable -->
  <rect x="20" y="468" width="620" height="76" rx="6" fill="#171717" stroke="#737373" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="32" y="486" font-size="11" fill="#a3a3a3">A csapat sávja (az ablak alatt marad): avatar + bal és jobb kéz</text>
  <g font-size="10" fill="#d4d4d4">
    <circle cx="52" cy="518" r="16" fill="#525252"/>
    <rect x="76" y="500" width="36" height="36" fill="#262626" stroke="#737373"/><text x="84" y="522">bal</text>
    <rect x="116" y="500" width="36" height="36" fill="#262626" stroke="#737373"/><text x="120" y="522">jobb</text>
    <circle cx="232" cy="518" r="16" fill="#525252"/>
    <rect x="256" y="500" width="36" height="36" fill="#262626" stroke="#737373"/><text x="264" y="522">bal</text>
    <rect x="296" y="500" width="36" height="36" fill="#262626" stroke="#737373"/><text x="300" y="522">jobb</text>
    <circle cx="412" cy="518" r="16" fill="#525252"/>
    <rect x="436" y="500" width="36" height="36" fill="#262626" stroke="#737373"/><text x="444" y="522">bal</text>
    <rect x="476" y="500" width="36" height="36" fill="#262626" stroke="#737373"/><text x="480" y="522">jobb</text>
  </g>

  <!-- notes -->
  <g font-size="12" fill="#78350f">
    <text x="662" y="76" font-weight="bold">Fejléc</text>
    <text x="662" y="92">bolt neve, kredit; húzás</text>
    <text x="662" y="108">közben az új egyenleg is</text>
    <text x="662" y="148" font-weight="bold">Üdvözlés</text>
    <text x="662" y="164">csak az egyszerű boltnál:</text>
    <text x="662" y="180">portré + az NPC szövege</text>
    <text x="662" y="224" font-weight="bold">Készlet</text>
    <text x="662" y="240">ár a sarokban,</text>
    <text x="662" y="256">∞ = nem fogy el</text>
    <text x="662" y="300" font-weight="bold">Hátizsák</text>
    <text x="662" y="316">a csapat közös zsákja</text>
    <text x="662" y="372" font-weight="bold">Info és súgó</text>
    <text x="662" y="388">kattintás: mi ez, mennyi</text>
    <text x="662" y="404">Shift+kattintás: gyors</text>
    <text x="662" y="420">vétel / eladás</text>
    <text x="662" y="510" font-weight="bold">Kezek</text>
    <text x="662" y="526">vétel kézbe is mehet</text>
  </g>
  <g stroke="#b45309" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#ar)">
    <path d="M656,300 C640,300 620,290 596,290"/>
    <path d="M656,506 C600,506 560,512 516,518"/>
    <path d="M656,240 C640,240 310,246 298,246"/>
  </g>
</svg>
