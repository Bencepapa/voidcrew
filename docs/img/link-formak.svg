<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="Segoe UI, Arial, sans-serif">
  <title>A link négy írásmódja</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="780" height="330" fill="#f6f8fa"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#0f172a">Négy írásmód, ugyanaz az eredmény</text>
  <text x="20" y="48" font-size="12" fill="#475569">A játékos a „Viszlát” gombot látja, és a „Goodbye Smith” passzusra lép.</text>

  <g font-family="Consolas, Menlo, monospace" font-size="14">
    <rect x="20" y="64" width="300" height="34" rx="5" fill="#0f172a"/><text x="32" y="86" fill="#fcd34d">[[Viszlát-&gt;Goodbye Smith]]</text>
    <rect x="20" y="112" width="300" height="34" rx="5" fill="#0f172a"/><text x="32" y="134" fill="#fcd34d">[[Goodbye Smith&lt;-Viszlát]]</text>
    <rect x="20" y="160" width="300" height="34" rx="5" fill="#0f172a"/><text x="32" y="182" fill="#fcd34d">[[Viszlát|Goodbye Smith]]</text>
    <rect x="20" y="208" width="300" height="34" rx="5" fill="#0f172a"/><text x="32" y="230" fill="#fcd34d">[[Goodbye Smith]]</text>
  </g>
  <text x="332" y="86" font-size="12" fill="#334155">felirat -&gt; cél (ezt ajánljuk)</text>
  <text x="332" y="134" font-size="12" fill="#334155">cél &lt;- felirat</text>
  <text x="332" y="182" font-size="12" fill="#334155">felirat | cél</text>
  <text x="332" y="230" font-size="12" fill="#334155">csak név: a felirat és a cél ugyanaz</text>

  <path d="M545,150 L600,150" stroke="#475569" stroke-width="2" marker-end="url(#ar)" fill="none"/>

  <rect x="610" y="64" width="150" height="40" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="640" y="89" font-size="13" fill="#075985">1  Viszlát</text>
  <text x="610" y="124" font-size="11" fill="#64748b">gomb a játékban</text>
  <rect x="610" y="150" width="150" height="56" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <rect x="610" y="150" width="150" height="22" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="620" y="166" font-size="12" font-weight="bold" fill="#0f172a">Goodbye Smith</text>
  <text x="610" y="226" font-size="11" fill="#64748b">passzus, ahová lépünk</text>

  <rect x="20" y="262" width="740" height="50" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="34" y="283" font-size="12" fill="#78350f">Fontos: a cél pontosan egyezzen a passzus nevével (kis- és nagybetű, szóköz, ékezet is számít).</text>
  <text x="34" y="301" font-size="12" fill="#78350f">Ha a cél nem létezik, törött link lesz, és a játék ezt hibának jelzi.</text>
</svg>
