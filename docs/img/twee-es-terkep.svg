<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470" font-family="Segoe UI, Arial, sans-serif">
  <title>A .twee szöveg és a Twine térkép egymásnak megfelelő részei</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="cor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="860" height="470" fill="#f6f8fa"/>
  <text x="20" y="28" font-size="15" font-weight="bold" fill="#0f172a">Ugyanaz a történet kétféleképpen</text>

  <!-- text side -->
  <text x="20" y="56" font-size="12" fill="#475569">A .twee fájl (szöveg)</text>
  <rect x="20" y="64" width="420" height="390" rx="6" fill="#0f172a"/>
  <g font-family="Consolas, Menlo, monospace" font-size="13">
    <text x="34" y="90" fill="#7dd3fc">:: StoryTitle</text>
    <text x="34" y="108" fill="#e2e8f0">Kovács kovács</text>

    <text x="34" y="140" fill="#7dd3fc">:: Start Smith [start] {"position":"100,100"}</text>
    <text x="34" y="158" fill="#e2e8f0">Kovács vagyok. Fegyvert vagy páncélt</text>
    <text x="34" y="176" fill="#e2e8f0">keresel?</text>
    <text x="34" y="200" fill="#fcd34d">[[Vásárlás-&gt;Smith buy]]</text>
    <text x="34" y="218" fill="#fcd34d">[[Viszlát-&gt;Goodbye Smith]]</text>

    <text x="34" y="250" fill="#7dd3fc">:: Smith buy {"position":"250,220"}</text>
    <text x="34" y="268" fill="#86efac">@shop smith-shop</text>
    <text x="34" y="292" fill="#fcd34d">[[Viszlát-&gt;Goodbye Smith]]</text>

    <text x="34" y="324" fill="#7dd3fc">:: Goodbye Smith {"position":"100,340"}</text>
    <text x="34" y="342" fill="#e2e8f0">Erős kard, erős kéz!</text>
    <text x="34" y="360" fill="#86efac">@end</text>
  </g>
  <text x="34" y="394" font-size="11" fill="#94a3b8">kék: fejléc (passzus neve, címke, hely)</text>
  <text x="34" y="412" font-size="11" fill="#94a3b8">fehér: a szereplő szövege</text>
  <text x="34" y="430" font-size="11" fill="#94a3b8">sárga: link = választás   zöld: @parancs (csak nálunk)</text>

  <!-- map side -->
  <text x="480" y="56" font-size="12" fill="#475569">A Twine térképe</text>
  <rect x="480" y="64" width="360" height="390" rx="6" fill="#ffffff" stroke="#cbd5e1"/>

  <path d="M600,190 C650,220 660,230 700,262" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M540,200 C500,250 500,330 540,372" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>
  <path d="M700,330 C680,360 640,372 612,386" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#ar)"/>

  <rect x="500" y="110" width="150" height="86" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="3"/>
  <text x="510" y="130" font-size="13" font-weight="bold" fill="#14532d">Start Smith</text>
  <rect x="590" y="116" width="52" height="14" rx="7" fill="#16a34a"/><text x="598" y="126" font-size="10" fill="#ffffff">start</text>
  <text x="510" y="152" font-size="11" fill="#334155">Kovács vagyok...</text>
  <text x="510" y="184" font-size="10" fill="#64748b">2 link</text>

  <rect x="670" y="262" width="150" height="76" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="680" y="282" font-size="13" font-weight="bold" fill="#0f172a">Smith buy</text>
  <text x="680" y="304" font-size="11" fill="#b45309">@shop smith-shop</text>

  <rect x="500" y="372" width="150" height="66" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="510" y="392" font-size="13" font-weight="bold" fill="#0f172a">Goodbye Smith</text>
  <text x="510" y="412" font-size="11" fill="#334155">Erős kard...</text>
  <text x="510" y="428" font-size="11" fill="#b45309">@end</text>

  <!-- correspondence arrows (dashed) -->
  <g stroke="#b45309" stroke-width="1.5" stroke-dasharray="5 4" fill="none" marker-end="url(#cor)">
    <path d="M395,134 C430,120 450,120 496,128"/>
    <path d="M365,256 C450,240 560,270 666,284"/>
    <path d="M400,320 C440,340 460,370 496,396"/>
  </g>
  <text x="680" y="236" font-size="10" fill="#b45309">szaggatott: ugyanaz a passzus</text>
</svg>
